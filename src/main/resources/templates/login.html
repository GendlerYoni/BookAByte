<!DOCTYPE html>
<html lang="he" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="/css/navbarStyle.css">
  <link rel="stylesheet" href="/css/commonStyle.css">
  <link rel="stylesheet" href="/css/loginStyle.css">
</head>
<body>

<div th:replace="~{navigationBar :: navbar}"></div>

<div class="login-container">

  <div class="login-right">
    <img src="/images/loginpic.png" alt="BookAByte">
  </div>

  <div class="login-left">
    <h2>התחברות</h2>

    <p class="login-subtitle">ברוכים הבאים בחזרה!</p>

    <div id="errorMessage" class="error-message hidden"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">שם משתמש:</label>
        <input type="text" id="username" name="username" required>
      </div>

      <div class="form-group">
        <label for="password">סיסמה:</label>
        <input type="password" id="password" name="password" required>
      </div>

      <a href="/register" class="register-link">עדיין לא רשום? הירשם כאן</a>

      <button type="submit">התחבר</button>
    </form>
  </div>

</div>

<script type="module" src="/js/login.js"></script>

</body>
</html>
